<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFFERU / AGENT LOOP</title>
<style>
:root{--bg:#F5F0E6;--ink:#1d1c1a;--red:#df3f35;--olive:#747a52;--card:#FBF7EC;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Courier New",ui-monospace,Menlo,Consolas,"Microsoft YaHei","PingFang SC",monospace;padding:12px;font-size:13px;line-height:1.5}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar .sq{width:9px;height:9px;background:var(--red);border:2px solid var(--ink);flex:none}
.bar .tt{font-size:11px;letter-spacing:.16em;font-weight:700}
.bar .sp{flex:1}
button{font:inherit;font-size:12px;border:2px solid var(--ink);background:var(--card);padding:5px 12px;cursor:pointer;font-weight:700}
button:hover:not(:disabled){background:var(--ink);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}
.btn-run{background:var(--red);color:#fff}
.btn-ok{background:var(--olive);color:#fff}
.cnt{display:flex;gap:8px;font-size:11px}
.cnt span{border:2px solid var(--ink);background:var(--card);padding:3px 8px}
.cnt b{color:var(--red)}
.grid{display:flex;gap:14px;align-items:flex-start}
.loopbox{flex:1.4;min-width:0;position:relative;border:2px solid var(--ink);background:var(--card);padding:14px;height:330px}
.node{position:absolute;width:30%;text-align:center;border:2px solid var(--ink);background:var(--bg);padding:7px 4px;font-size:12px;font-weight:700;cursor:default;transition:background .15s,color .15s;z-index:3}
.node .en{display:block;font-size:9px;font-weight:400;letter-spacing:.1em;color:var(--olive)}
.node.flash{background:var(--red);color:#fff}
.node.flash .en{color:#fff}
svg.wire{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.pkt{position:absolute;width:13px;height:13px;background:var(--red);border:2px solid var(--ink);transform:translate(-50%,-50%);display:none;z-index:4;transition:left .55s cubic-bezier(.6,.05,.3,1),top .55s cubic-bezier(.6,.05,.3,1),opacity .3s}
.gate{flex:1;min-width:0;border:2px solid var(--ink);background:var(--card);box-shadow:5px 5px 0 var(--ink);padding:12px}
.gate h3,.side h3{font-size:13px;margin-bottom:2px}
.gate .en,.side .en{font-size:10px;letter-spacing:.12em;color:var(--olive);margin-bottom:10px}
.step{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--ink);padding:6px 0;font-size:12px}
.step .dot{width:10px;height:10px;border:2px solid var(--ink);background:var(--bg);flex:none}
.step.on .dot{background:var(--red)}
.step.done .dot{background:var(--olive)}
.badge{display:inline-block;border:2px solid var(--red);background:var(--red);color:#fff;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.1em;margin:8px 0;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.hint{font-size:10px;color:var(--olive);letter-spacing:.06em;margin-top:8px}
.side{flex:.8;min-width:0;border:2px solid var(--red);background:var(--card);padding:12px}
.side li{list-style:none;padding:5px 0 5px 16px;border-top:1px dashed var(--ink);position:relative;font-size:12px}
.side li::before{content:"✕";position:absolute;left:0;color:var(--red);font-weight:700}
.side .ok{color:var(--olive);font-size:11px;margin-top:8px;border-top:2px solid var(--ink);padding-top:6px}
.side .ok::before{content:"✓ "}
@media (max-width:760px){.grid{flex-direction:column}.loopbox{width:100%}}
@media (prefers-reduced-motion:reduce){.pkt{transition:none}.badge{animation:none}}
</style>
</head>
<body>
<header class="bar">
  <span class="sq"></span><span class="tt">OFFERU / AGENT LOOP</span>
  <span class="sp"></span>
  <button class="btn-run" id="run">▶ 运行一轮</button>
  <button id="reject">✕ 拒绝提案</button>
  <button class="btn-ok" id="confirm" disabled>✓ 确认落库</button>
  <div class="cnt"><span>提案 <b id="nProp">0</b></span><span>已确认 <b id="nOk">0</b></span><span>被拒绝 <b id="nNo">0</b></span></div>
</header>
<div class="grid">
  <section class="loopbox" id="loop">
    <svg class="wire" id="wire" aria-hidden="true"></svg>
    <div class="pkt" id="pkt"></div>
  </section>
  <aside class="gate" id="gate">
    <h3>Operation Registry</h3>
    <div class="en">CONTROL GATE — 每次自动写入必经</div>
    <div class="step" data-s="0"><span class="dot"></span>授权<span class="en2"></span></div>
    <div class="step" data-s="1"><span class="dot"></span>提案 Proposal</div>
    <div class="step" data-s="2"><span class="dot"></span>确认 Confirm</div>
    <div class="step" data-s="3"><span class="dot"></span>审计 Audit</div>
    <div id="gatebadge"></div>
    <div class="hint">数据包在 Registry 暂停，等待人工确认后才落库；拒绝则丢弃本次提案。</div>
  </aside>
  <aside class="side">
    <h3>安全边界</h3>
    <div class="en">AGENT 禁止区 — 必须人工</div>
    <ul>
      <li>验证码 / 人机验证</li>
      <li>登录 / 账号凭证操作</li>
      <li>最终投递提交</li>
      <li>与招聘方的实时沟通</li>
    </ul>
    <div class="ok">Agent 只准备与提案；以上动作一律转交人工完成。</div>
  </aside>
</div>
<script>
(function(){
"use strict";
var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var NODES=[
 {zh:"简历解析",en:"PARSE",   x:50,y:8},
 {zh:"岗位匹配",en:"MATCH",   x:78,y:38},
 {zh:"内容重写",en:"REWRITE", x:50,y:70},
 {zh:"模拟面试",en:"INTERVIEW",x:22,y:38},
 {zh:"自检纠错",en:"SELF-CHECK",x:36,y:15}
];
var loop=document.getElementById("loop"),wire=document.getElementById("wire"),pkt=document.getElementById("pkt");
var nodeEls=NODES.map(function(n,i){
  var d=document.createElement("div");d.className="node";
  d.innerHTML=n.zh+'<span class="en">'+n.en+"</span>";
  d.style.left="calc("+n.x+"% - 15%)";d.style.top="calc("+n.y+"% - 14px)";
  loop.appendChild(d);return d;
});
function center(i){
  var e=nodeEls[i],r=loop.getBoundingClientRect(),b=e.getBoundingClientRect();
  return {x:b.left-r.left+b.width/2,y:b.top-r.top+b.height/2};
}
function drawWire(){
  var pts=NODES.map(function(_,i){return center(i);});
  var d="";
  var seq=[0,1,2,3,4,0];
  for(var k=0;k<seq.length-1;k++){
    var a=pts[seq[k]],b=pts[seq[k+1]];
    d+="M"+a.x+" "+a.y+" L"+b.x+" "+b.y+" ";
  }
  wire.innerHTML='<path d="'+d+'" fill="none" stroke="#1d1c1a" stroke-width="2" stroke-dasharray="6 4"/>'+
    pts.map(function(p){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="#df3f35"/>';}).join("");
}
drawWire();
if(window.ResizeObserver){new ResizeObserver(drawWire).observe(loop);}else{window.addEventListener("resize",drawWire);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function flash(e){e.classList.add("flash");setTimeout(function(){e.classList.remove("flash");},430);}
function moveTo(i){
  var c=center(i);
  pkt.style.left=c.x+"px";pkt.style.top=c.y+"px";
}
var steps=document.querySelectorAll(".step");
function setStep(s,state){
  steps.forEach(function(el,i){
    el.classList.toggle("done",i<s);
    el.classList.toggle("on",i===s&&state==="on");
  });
}
var run=document.getElementById("run"),confirmB=document.getElementById("confirm"),rejectB=document.getElementById("reject");
var nProp=0,nOk=0,nNo=0;
function counts(){
  document.getElementById("nProp").textContent=nProp;
  document.getElementById("nOk").textContent=nOk;
  document.getElementById("nNo").textContent=nNo;
}
var running=false,waiting=false,decision=null;
confirmB.addEventListener("click",function(){if(waiting){decision="ok";}});
rejectB.addEventListener("click",function(){if(waiting){decision="no";}});
run.addEventListener("click",async function(){
  if(running)return;running=true;this.disabled=true;this.textContent="… 运行中";
  var i;
  pkt.style.display="block";pkt.style.opacity="1";
  moveTo(0);await sleep(60);
  var seq=[0,1,2,3,4,0];
  var gateIdx=2; // packet detours through gate after REWRITE stage? spec: every write passes gate — gate after 内容重写 before continuing
  for(var k=0;k<seq.length;k++){
    i=seq[k];
    moveTo(i);await sleep(RM?120:560);flash(nodeEls[i]);
    if(NODES[i].en==="REWRITE"){
      // enter control gate
      steps.forEach(function(el){el.classList.remove("on","done");});
      setStep(0,"on");await sleep(RM?80:350);setStep(0,"done");
      setStep(1,"on");nProp++;counts();
      await sleep(RM?80:350);setStep(1,"done");
      setStep(2,"on");
      var badge=document.getElementById("gatebadge");
      badge.innerHTML='<span class="badge">等待确认 AWAITING CONFIRM</span>';
      waiting=true;decision=null;
      confirmB.disabled=false;rejectB.disabled=false;
      while(decision===null){await sleep(120);}
      waiting=false;confirmB.disabled=true;rejectB.disabled=true;
      if(decision==="no"){
        nNo++;counts();
        badge.innerHTML='<span class="badge" style="border-color:var(--ink);background:var(--ink)">已丢弃 DISCARDED</span>';
        setStep(2,"on");
        await sleep(600);
        badge.innerHTML="";steps.forEach(function(el){el.classList.remove("on","done");});
        pkt.style.opacity="0";await sleep(320);pkt.style.display="none";
        running=false;run.disabled=false;run.textContent="▶ 运行一轮";
        return;
      }
      nOk++;counts();
      badge.innerHTML='<span class="badge" style="border-color:var(--olive);background:var(--olive)">已落库 COMMITTED</span>';
      setStep(2,"done");setStep(3,"on");await sleep(RM?80:400);setStep(3,"done");
      setTimeout(function(){badge.innerHTML="";steps.forEach(function(el){el.classList.remove("on","done");});},1600);
    }
  }
  pkt.style.opacity="0";await sleep(320);pkt.style.display="none";
  running=false;run.disabled=false;run.textContent="▶ 运行一轮";
});
})();
</script>
</body>
</html>
